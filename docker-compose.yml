# Conduit with Postgres persistence.
#
#   docker compose up --build
#   open http://localhost:8080
#
# State persists in the `pgdata` volume across restarts.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit
      POSTGRES_DB: conduit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit -d conduit"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published by default; the app reaches it over the compose network.

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      CONDUIT_ADDR: ":8080"
      CONDUIT_DATABASE_URL: "postgres://conduit:conduit@db:5432/conduit?sslmode=disable"
      # Encryption key for stored secrets. CHANGE THIS and keep it stable, or
      # stored secrets become undecryptable. Prefer a Docker/compose secret in prod.
      CONDUIT_SECRET_KEY: "change-me-in-production"
      # Signs login sessions (JWT). CHANGE THIS; keep it stable or sessions reset.
      CONDUIT_JWT_SECRET: "change-me-too-in-production"
      # Bootstrap admin, created only on first run (no users yet). Change the
      # password after first login.
      CONDUIT_ADMIN_EMAIL: "admin@conduit.local"
      CONDUIT_ADMIN_PASSWORD: "conduit"
      # Optional external sign-in. Set these in your shell (or a .env file) and they
      # pass through; leave unset and the UI stays email-only. CONDUIT_BASE_URL must
      # be the public origin so OAuth redirect URIs match what you registered.
      CONDUIT_BASE_URL: "${CONDUIT_BASE_URL:-}"
      CONDUIT_GOOGLE_CLIENT_ID: "${CONDUIT_GOOGLE_CLIENT_ID:-}"
      CONDUIT_GOOGLE_CLIENT_SECRET: "${CONDUIT_GOOGLE_CLIENT_SECRET:-}"
      CONDUIT_GITHUB_CLIENT_ID: "${CONDUIT_GITHUB_CLIENT_ID:-}"
      CONDUIT_GITHUB_CLIENT_SECRET: "${CONDUIT_GITHUB_CLIENT_SECRET:-}"
    # No host port is published here on purpose: a managed platform (Coolify,
    # Dokploy, etc.) routes to the container over the Docker network via its own
    # reverse proxy, so binding a host port only causes "port already allocated".
    # The container listens on 8080 — point your platform's domain at port 8080.
    # Local `docker compose up` / `make up` still publishes it via
    # docker-compose.override.yml (which managed platforms ignore).
    expose:
      - "8080"
    healthcheck:
      # The binary self-checks over HTTP (the image has no shell/curl).
      test: ["CMD", "/conduitd", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
