<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Conduit Agent — intro video</title>
<!--
  Source for the ~40 s Conduit Agent intro video (1920×1080).
  Every frame is a pure function of time: render(t) sets the whole scene for t
  seconds, so render.js can step through it frame by frame and encode an MP4.
  Open this file in a browser to preview it in real time.
  Run values (ENG-482, PR #129, confidence 86) are sample data, labelled on screen.
-->
<style>
  @font-face { font-family: "JB"; font-weight: 400; src: url("../../web/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "JB"; font-weight: 500; src: url("../../web/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "JB"; font-weight: 600; src: url("../../web/node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-600-normal.woff2") format("woff2"); }
  :root {
    --bg: #080b12; --s1: #0f1522; --s2: #151c2a; --s3: #1c2536; --line: #212b3d; --line2: #34425c;
    --fg: #e8ecf4; --muted: #a3aec2; --faint: #6f7c94;
    --violet: #8b5cf6; --violet2: #b9a2ff; --cyan: #22d3ee; --ok: #34d399; --warn: #fbbf24; --bad: #f87171;
    --mono: "JB", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: "Inter", system-ui, sans-serif; color: var(--fg); -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  .abs { position: absolute; }
  .scene { position: absolute; inset: 0; opacity: 0; }

  /* backdrop */
  .aur { position: absolute; border-radius: 50%; filter: blur(90px); }
  .grid { position: absolute; inset: -60px; background-image:
      linear-gradient(to right, rgba(52,66,92,.35) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(52,66,92,.35) 1px, transparent 1px);
    background-size: 60px 60px;
    -webkit-mask-image: radial-gradient(ellipse 75% 65% at 50% 45%, #000 20%, transparent 75%);
            mask-image: radial-gradient(ellipse 75% 65% at 50% 45%, #000 20%, transparent 75%); }

  .grad { background: linear-gradient(95deg, #8b5cf6, #6d8cf5 45%, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .kicker { display: inline-flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 22px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--violet2); padding: 10px 22px; border-radius: 999px; border: 1px solid rgba(139,92,246,.45); background: rgba(139,92,246,.1); }
  .caption { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font-size: 40px; font-weight: 600; letter-spacing: -.02em; }
  .caption b { color: var(--fg); } .caption span { color: var(--muted); font-weight: 500; }
  .tag { font-family: var(--mono); font-size: 16px; letter-spacing: .1em; color: var(--faint); border: 1px dashed var(--line2); border-radius: 999px; padding: 4px 12px; }

  /* hub scene */
  .panel { position: absolute; border: 1px solid var(--line2); border-radius: 26px; background: rgba(15,21,34,.78); box-shadow: 0 30px 80px rgba(0,0,0,.55); }
  .hn { position: absolute; transform: translate(-50%,-50%); display: flex; align-items: center; gap: 14px; padding: 14px 20px 14px 14px; white-space: nowrap;
    border-radius: 16px; border: 1px solid var(--line2); background: var(--s2); }
  .hn .ico { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; flex: 0 0 auto; }
  .hn .ico svg { width: 24px; height: 24px; }
  .hn b { display: block; font-size: 22px; font-weight: 600; line-height: 1.2; }
  .hn small { display: block; font-family: var(--mono); font-size: 15px; color: var(--faint); }
  .hn .ok { position: absolute; top: -13px; right: -13px; width: 30px; height: 30px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; }
  .hn .ok svg { width: 18px; height: 18px; }
  .hub { position: absolute; width: 230px; height: 230px; border-radius: 50%; transform: translate(-50%,-50%); display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 35%, #2a1a5e, #140f2e 70%); border: 2px solid rgba(139,92,246,.7); }
  .hub b { font-size: 34px; font-weight: 700; } .hub small { font-family: var(--mono); font-size: 16px; color: var(--violet2); margin-top: 6px; }
  .think { position: absolute; transform: translate(-50%,-50%); font-size: 19px; font-weight: 600; color: #e9e1ff; padding: 10px 18px; border-radius: 999px;
    background: rgba(76,48,160,.85); border: 1px solid rgba(185,162,255,.5); white-space: nowrap; }
  .log { position: absolute; font-family: var(--mono); }
  .log h4 { font-size: 16px; letter-spacing: .14em; color: var(--faint); font-weight: 500; padding: 22px 26px 16px; border-bottom: 1px solid var(--line); }
  .log .l { display: flex; gap: 18px; font-size: 18px; white-space: nowrap; padding: 9px 26px; color: var(--fg); }
  .log .l i { font-style: normal; color: var(--cyan); width: 82px; flex: 0 0 auto; }
  .card { position: absolute; display: flex; align-items: center; gap: 18px; padding: 24px 26px; border-radius: 20px; border: 1px solid var(--line2); background: var(--s1); }
  .card .ci { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; }
  .card b { display: block; font-size: 26px; white-space: nowrap; } .card small { display: block; font-size: 22px; color: var(--muted); margin-top: 4px; }
  .toast { position: absolute; display: flex; align-items: center; gap: 16px; padding: 22px 26px; border-radius: 20px; font-size: 27px; font-weight: 600;
    border: 1px solid rgba(52,211,153,.55); background: rgba(52,211,153,.1); }

  /* gate scene */
  .gate { position: absolute; left: 50%; top: 470px; width: 1000px; transform: translate(-50%,-50%); padding: 38px 42px; border-radius: 28px;
    border: 1px solid rgba(251,191,36,.6); background: linear-gradient(180deg, rgba(251,191,36,.08), rgba(15,21,34,.95)); box-shadow: 0 40px 100px rgba(0,0,0,.6); }
  .gate h3 { display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 650; color: var(--warn); }
  .gate .t { margin-top: 14px; font-size: 24px; color: var(--muted); } .gate .t b { font-family: var(--mono); color: var(--fg); font-size: 21px; margin-right: 10px; }
  .dl { margin-top: 22px; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line2); background: rgba(8,11,18,.75);
    font-family: var(--mono); font-size: 19px; line-height: 1.65; }
  .dl div { white-space: pre; overflow: hidden; text-overflow: ellipsis; color: var(--muted); padding: 0 8px; border-radius: 6px; }
  .dl .f { color: var(--fg); font-weight: 600; margin-top: 6px; } .dl .f:first-child { margin-top: 0; }
  .dl .f em { font-style: normal; font-size: 13px; color: var(--ok); border: 1px solid rgba(52,211,153,.45); border-radius: 999px; padding: 1px 8px; margin-left: 8px; }
  .dl .a { color: #7eecc4; background: rgba(52,211,153,.10); }
  .files { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
  .files div { display: flex; align-items: baseline; gap: 16px; font-size: 22px; }
  .files em { font-style: normal; font-family: var(--mono); font-size: 16px; padding: 3px 10px; border-radius: 8px; color: var(--cyan); border: 1px solid rgba(34,211,238,.45); }
  .files em.c { color: var(--ok); border-color: rgba(52,211,153,.45); }
  .files code { font-family: var(--mono); color: var(--fg); } .files span { color: var(--faint); }
  .gb { display: flex; gap: 14px; margin-top: 30px; }
  .gb button { font: inherit; font-size: 24px; font-weight: 650; padding: 14px 30px; border-radius: 14px; border: 1px solid var(--line2); background: var(--s2); color: var(--fg); }
  .gb button.ap { background: var(--ok); color: #04130d; border-color: transparent; }
  .res { margin-top: 30px; display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 600; color: var(--ok); }
  .checks { position: absolute; left: 50%; top: 790px; transform: translateX(-50%); display: flex; gap: 16px; }
  .chk { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 22px; padding: 12px 20px; border-radius: 999px; border: 1px solid var(--line2); background: var(--s1); }
  .chk i { width: 14px; height: 14px; border-radius: 50%; background: var(--faint); }
  .cursor { position: absolute; width: 44px; height: 44px; }


  /* models & cost scene */
  .tierrow { display: flex; align-items: center; gap: 20px; padding: 20px 24px; border-radius: 18px; border: 1px solid var(--line2); background: var(--s2); margin-bottom: 16px; }
  .tierrow .tn { flex: 0 0 150px; font-size: 26px; font-weight: 700; }
  .tierrow .tm { font-family: var(--mono); font-size: 22px; color: var(--violet2); flex: 0 0 auto; }
  .tierrow .tu { margin-left: auto; font-size: 20px; color: var(--muted); text-align: right; }
  .tierrow .pr { display: block; font-family: var(--mono); font-size: 16px; color: var(--faint); margin-top: 4px; }
  .upchip { position: absolute; display: inline-flex; align-items: center; gap: 12px; font-size: 21px; font-weight: 600; color: var(--warn);
    padding: 12px 20px; border-radius: 999px; border: 1px solid rgba(251,191,36,.55); background: rgba(251,191,36,.1); white-space: nowrap; }
  .costhead { display: flex; align-items: baseline; gap: 14px; padding: 22px 26px 16px; border-bottom: 1px solid var(--line); }
  .costhead b { font-size: 22px; } .costhead span { font-family: var(--mono); font-size: 16px; color: var(--faint); letter-spacing: .1em; }
  .costrow { display: grid; grid-template-columns: 1fr 170px 100px 110px; gap: 10px; align-items: center; padding: 13px 26px; font-size: 20px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .costrow .m { font-family: var(--mono); font-size: 17px; color: var(--violet2); }
  .costrow .m.up { color: var(--warn); }
  .costrow .k, .costrow .c { text-align: right; font-family: var(--mono); font-size: 18px; color: var(--muted); }
  .costrow .c { color: var(--fg); }
  .costtot { display: flex; align-items: baseline; justify-content: space-between; padding: 20px 26px; font-size: 24px; font-weight: 650; }
  .costtot b { font-size: 44px; font-family: var(--mono); color: var(--ok); }

  /* steps scene */
  .step { position: absolute; top: 330px; width: 520px; height: 470px; padding: 26px; border-radius: 28px; border: 1px solid var(--line2);
    background: linear-gradient(180deg, var(--s1), rgba(15,21,34,.4)); }
  .step .art { height: 200px; border-radius: 18px; border: 1px solid var(--line); background: rgba(8,11,18,.6); display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 0 26px; }
  .step .n { font-family: var(--mono); font-size: 22px; color: var(--cyan); margin-top: 26px; }
  .step h3 { font-size: 34px; letter-spacing: -.02em; margin-top: 10px; }
  .step p { font-size: 22px; color: var(--muted); margin-top: 12px; line-height: 1.45; }
  .row { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 19px; padding: 10px 14px; border-radius: 12px; background: var(--s2); }
  .row em { margin-left: auto; font-style: normal; letter-spacing: .2em; color: var(--faint); }
  .pill { display: inline-flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 600; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line2); background: var(--s2); }
  .pill svg { color: var(--ok); }
  .okrow { display: flex; align-items: center; gap: 12px; font-size: 21px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--s2); }
  .okrow i { width: 24px; height: 24px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; }

  /* integrations */
  .int { position: absolute; transform: translate(-50%,-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .int .m { width: 84px; height: 84px; border-radius: 22px; display: grid; place-items: center; font-family: var(--mono); font-size: 24px; font-weight: 600; border: 1px solid; }
  .int span { font-size: 20px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .orbit { position: absolute; border-radius: 50%; border: 1px dashed rgba(52,66,92,.8); transform: translate(-50%,-50%); }

  /* cta */
  .cta-btn { display: inline-flex; align-items: center; gap: 14px; font-size: 32px; font-weight: 650; padding: 22px 40px; border-radius: 18px; color: #fff;
    background: linear-gradient(135deg, #8b5cf6, #7c3aed); box-shadow: 0 18px 50px -12px rgba(139,92,246,.9); }
  .repo { display: inline-flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 28px; padding: 20px 32px; border-radius: 18px; border: 1px solid var(--line2); background: var(--s1); }
  .facts { display: flex; justify-content: center; gap: 46px; font-size: 26px; color: var(--muted); }
  .facts span { display: inline-flex; align-items: center; gap: 12px; } .facts svg { color: var(--ok); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const DURATION = 39.6;      // seconds
const W = 1920, H = 1080;

/* ---------- helpers ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = (p) => 1 - Math.pow(1 - clamp(p), 3);
const easeInOut = (p) => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
// 0→1 between a and a+d
const prog = (t, a, d) => clamp((t - a) / d);
// visibility of a scene window [a,b] with fades
const win = (t, a, b, fi = .45, fo = .45) => Math.min(prog(t, a, fi), 1 - prog(t, b - fo, fo));
const el = (tag, cls, html, parent) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent || stage).appendChild(e); return e; };
const css = (e, o) => { for (const k in o) e.style[k] = o[k]; };
const rise = (e, p, dy = 34) => css(e, { opacity: easeOut(p), transform: (e.dataset.base || "") + ` translateY(${(1 - easeOut(p)) * dy}px)` });

const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="#04130d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  checkG: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  ticket: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M9 9h6M9 15h6"/></svg>',
  issue: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>',
  notion: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  bot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M8 4h8M9 14h.01M15 14h.01"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 11l2 2 4-4"/></svg>',
  branch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="7" r="2.5"/><path d="M6 7.5v9M18 9.5c0 5-12 3-12 7"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  pr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M6 7.5v9M18 16.5V9a3 3 0 0 0-3-3h-4M13 3.5 10.5 6 13 8.5"/></svg>',
  hand: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>',
  key: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.3-9.3M17 6l3 3M14.5 8.5l2 2"/></svg>',
  star: '<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>',
};
const markSVG = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32" fill="none"><defs><linearGradient id="mg${s}" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse"><stop stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><rect x="1" y="1" width="30" height="30" rx="9" fill="url(#mg${s})" opacity=".16"/><rect x="1" y="1" width="30" height="30" rx="9" stroke="url(#mg${s})" stroke-width="1.4"/><path d="M8 16h5.5c3.6 0 3.6-6.5 7.2-6.5M13.5 16c3.6 0 3.6 6.5 7.2 6.5" stroke="url(#mg${s})" stroke-width="2.3" stroke-linecap="round"/><circle cx="22.6" cy="9.5" r="2.3" fill="#22D3EE"/><circle cx="22.6" cy="22.5" r="2.3" fill="#8B5CF6"/></svg>`;

const stage = document.getElementById("stage");

/* ---------- backdrop (always on) ---------- */
const a1 = el("div", "aur"); css(a1, { width: "1100px", height: "800px", background: "rgba(139,92,246,.32)" });
const a2 = el("div", "aur"); css(a2, { width: "900px", height: "700px", background: "rgba(34,211,238,.16)" });
const grid = el("div", "grid");

/* =========================================================================
   S1 — hook (0 – 4.4)
   ========================================================================= */
const s1 = el("div", "scene");
const s1a = el("div", "abs", "Every team has a backlog of tickets.", s1);
css(s1a, { left: 0, right: 0, top: "380px", textAlign: "center", fontSize: "62px", fontWeight: 600, letterSpacing: "-.03em", color: "var(--muted)" });
const s1b = el("div", "abs", 'What if each one became a <span class="grad">reviewed pull request</span>?', s1);
css(s1b, { left: 0, right: 0, top: "500px", textAlign: "center", fontSize: "64px", fontWeight: 700, letterSpacing: "-.035em" });
// a little stack of tickets flying in behind the line
const s1t = [];
for (let i = 0; i < 6; i++) {
  const c = el("div", "abs", `<span style="font-family:var(--mono);font-size:18px;color:var(--faint)">ENG-${470 + i * 7}</span>`, s1);
  css(c, { width: "180px", height: "64px", borderRadius: "14px", border: "1px solid var(--line2)", background: "var(--s1)", display: "grid", placeItems: "center" });
  s1t.push(c);
}

/* =========================================================================
   S2 — brand (4.4 – 8.6)
   ========================================================================= */
const s2 = el("div", "scene");
const s2m = el("div", "abs", markSVG(120), s2); css(s2m, { left: "900px", top: "170px" });
const s2n = el("div", "abs", 'Conduit <span style="color:var(--muted);font-weight:500">Agent</span>', s2);
css(s2n, { left: 0, right: 0, top: "315px", textAlign: "center", fontSize: "46px", fontWeight: 700 });
const s2h1 = el("div", "abs", "Tickets in.", s2);
css(s2h1, { left: 0, right: 0, top: "410px", textAlign: "center", fontSize: "132px", fontWeight: 700, letterSpacing: "-.045em", lineHeight: 1 });
const s2h2 = el("div", "abs grad", "Reviewed pull requests out.", s2);
css(s2h2, { left: 0, right: 0, top: "545px", textAlign: "center", fontSize: "132px", fontWeight: 700, letterSpacing: "-.045em", lineHeight: 1.05 });
const s2k = el("div", "abs", '<span class="kicker">Open-source AI software factory</span>', s2);
css(s2k, { left: 0, right: 0, top: "760px", textAlign: "center" });

/* =========================================================================
   S3 — the run, around the hub (8.6 – 18.0)
   ========================================================================= */

  css(gate, { opacity: gi, transform: `translate(-50%,-50%) scale(${lerp(.94, 1, gi)})` });
  // cursor path → Approve button, click at 2.3s
  if (!window._btn && gateBtns.style.display !== "none" && l > .9) { const r = gateBtn.getBoundingClientRect(); window._btn = { x: r.left + r.width * .45, y: r.top + r.height * .55 }; }
  const bx = window._btn ? window._btn.x : 735, by = window._btn ? window._btn.y : 806;
  const cp = easeInOut(prog(l, 1.0, 1.2));
  css(cursor, { left: lerp(1500, bx, cp) + "px", top: lerp(1000, by, cp) + "px", opacity: prog(l, .8, .3) * (1 - prog(l, 3.0, .3)) });
  const click = l >= 2.3, press = prog(l, 2.2, .1) * (1 - prog(l, 2.35, .12));
  gateBtn.style.transform = `scale(${1 - press * .08})`;
  gateBtns.style.display = click ? "none" : "flex";
  gateRes.style.display = click ? "flex" : "none";
  css(gate, { borderColor: click ? "rgba(52,211,153,.6)" : "rgba(251,191,36,.6)" });
  chkEls.forEach((c, i) => {
    const p = prog(l, 2.8 + i * .45, .35);
    css(c, { opacity: easeOut(p), transform: `translateY(${(1 - easeOut(p)) * 16}px)` });
    const dot = c.querySelector("i");
    if (dot) { const ok = l > 3.0 + i * .45; dot.style.background = ok ? "#34D399" : "#22D3EE"; dot.style.boxShadow = ok ? "0 0 10px #34D399" : "none"; }
  });
  rise(s4cap, prog(l, .6, .6), 20);

  /* SM */
  l = vis(sM, "sM", .4, .45);
  rise(sMk, prog(l, 0, .5)); rise(sMh, prog(l, .15, .6));
  tierEls.forEach((e, i) => rise(e, prog(l, .4 + i * .18, .6), 30));
  const up = easeOut(prog(l, 1.5, .5));
  css(sMup, { opacity: up, transform: `translateY(${(1 - up) * 14}px)` });
  tierEls[2].style.borderColor = l > 1.6 ? "rgba(251,191,36,.6)" : "var(--line2)";
  rise(sMc, prog(l, .5, .6));
  costEls.forEach((e, i) => css(e, { opacity: easeOut(prog(l, .8 + i * .2, .3)) }));
  const tp = easeOut(prog(l, .8 + COSTS.length * .2, .5));
  costTot.querySelector("b").textContent = "$" + (COST_TOTAL * tp).toFixed(2);
  costTot.style.opacity = prog(l, .7 + COSTS.length * .2, .3);
  rise(sMcap, prog(l, .6, .6), 20);

  /* S5 */
  l = vis(s5, "s5", .4, .45);
  rise(s5k, prog(l, 0, .5)); rise(s5h, prog(l, .15, .6));
  stepEls.forEach((e, i) => rise(e, prog(l, .5 + i * .3, .7), 50));

  /* S6 */
  l = vis(s6, "s6", .4, .45);
  rise(s6h, prog(l, 0, .5));
  css(hub6, { opacity: easeOut(prog(l, .1, .5)) });
  intEls.forEach(({ e, ring, i, n }) => {
    const p = easeOut(prog(l, .2 + (ring === 1 ? i * .07 : .4 + i * .06), .6));
    const r = (ring === 1 ? 250 : 430) * lerp(.55, 1, p);
    const ang = ((360 / n) * i - 90 + (ring === 1 ? 0 : 25) + l * (ring === 1 ? 6 : -4)) * Math.PI / 180;
    css(e, { left: C6.x + r * Math.cos(ang) + "px", top: C6.y + r * Math.sin(ang) * .9 + "px", opacity: p });
  });

  /* S7 */
  l = vis(s7, "s7", .45, .01);
  const p7 = easeOut(prog(l, 0, .7));
  css(s7m, { opacity: p7, transform: `scale(${lerp(.9, 1, p7)})` });
  rise(s7h, prog(l, .3, .6), 40); rise(s7f, prog(l, .7, .6)); rise(s7c, prog(l, 1.0, .6)); rise(s7s, prog(l, 1.3, .6));
};

// Live preview when opened directly (render.js drives it frame by frame instead).
if (!/[?&]capture/.test(location.search)) {
  const start = performance.now();
  (function loop() { render(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); })();
} else render(0);
</script>
