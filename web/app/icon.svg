<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Conduit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d1512"/>
      <stop offset="1" stop-color="#060a09"/>
    </linearGradient>
    <linearGradient id="g" x1="150" y1="130" x2="380" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00f5a3"/>
      <stop offset="1" stop-color="#00b37e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#00d992" stroke-opacity="0.16" stroke-width="2"/>
  <!-- conduit edges: one trigger fanning out to two downstream nodes -->
  <path d="M168 256 C 236 256, 236 170, 344 170" stroke="url(#g)" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M168 256 C 236 256, 236 342, 344 342" stroke="url(#g)" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- flow pulses -->
  <circle cx="252" cy="213" r="9" fill="#eafff6"/>
  <circle cx="252" cy="299" r="9" fill="#eafff6"/>
  <!-- trigger node -->
  <circle cx="168" cy="256" r="46" fill="#07100d" stroke="url(#g)" stroke-width="18"/>
  <circle cx="168" cy="256" r="15" fill="url(#g)"/>
  <!-- downstream nodes -->
  <circle cx="356" cy="170" r="40" fill="#07100d" stroke="url(#g)" stroke-width="16"/>
  <circle cx="356" cy="170" r="13" fill="url(#g)"/>
  <circle cx="356" cy="342" r="40" fill="#07100d" stroke="url(#g)" stroke-width="16"/>
  <circle cx="356" cy="342" r="13" fill="url(#g)"/>
</svg>
